services:
  postgres:
    # using alpine image to reduce image size
    image: postgres:alpine
    healthcheck:
      test: pg_isready -d drop -U drop
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 10s
    volumes:
      - ./db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=drop
      - POSTGRES_USER=drop
      - POSTGRES_DB=drop
  drop:
    image: ghcr.io/drop-oss/drop:nightly
    stdin_open: true
    tty: true
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3000:3000
    volumes:
      - ./library:/library
      - ./data:/data
    environment:
      - DATABASE_URL=postgres://drop:drop@postgres:5432/drop
      # --- ZeroTier co-op rooms (optional) ---
      # Point Drop at the self-hosted controller sidecar below. Leave blank to
      # disable the feature. ZEROTIER_AUTH_TOKEN is the controller's
      # authtoken.secret — paste it after the controller's first boot (see
      # docs/zerotier-controller.md). Inline token avoids cross-container file perms.
      - ZEROTIER_CONTROLLER_URL=http://zerotier-controller:9993
      - ZEROTIER_AUTH_TOKEN=
      # --- Archipelago WebHost (optional) ---
      # Browser-openable URL of your Archipelago WebHost. When set, the client's
      # Archipelago screen links to it + deep-links a game's YAML options page.
      - ARCHIPELAGO_WEBHOST_URL=

  # Self-hosted ZeroTier network controller. It MINTS + AUTHORIZES virtual-LAN
  # networks for co-op rooms but never JOINS one itself, so it needs no TUN
  # device and no NET_ADMIN capability. If your NAS refuses to start the
  # container, uncomment the devices/cap_add fallback below.
  zerotier-controller:
    image: zyclonite/zerotier:latest # pin to a specific tag once verified on your NAS
    container_name: drop-zerotier-controller
    restart: unless-stopped
    # devices:
    #   - /dev/net/tun
    # cap_add:
    #   - NET_ADMIN
    volumes:
      - ./zerotier:/var/lib/zerotier-one
